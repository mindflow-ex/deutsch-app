name: Сборка и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Автопроверки контента
        run: npm run check

      - name: Кэш озвучки и модели
        uses: actions/cache@v4
        with:
          path: |
            .cache/piper
            .cache/*.zip
            public/audio
            public/models
          key: media-${{ hashFiles('content/**', 'scripts/gen-audio.py') }}
          restore-keys: media-

      - name: Модель распознавания Vosk (немецкая small)
        run: ./scripts/fetch-vosk-model.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Озвучка Piper
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q piper-tts
          node scripts/collect-texts.mjs
          python scripts/gen-audio.py

      - name: Сборка
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
