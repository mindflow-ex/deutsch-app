name: Образцы голосов
on:
  push:
    branches: [voice-samples]
    paths-ignore: ['voice-samples/**']
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q edge-tts piper-tts
      - run: python scripts/voice-samples.py
      - name: Сохранить образцы в ветку
        run: |
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add voice-samples && git commit -m "Voice samples [skip ci]" && git push
